name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Verify lockfile
        run: uv lock --check

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Run tests
        run: uv run --frozen pytest

      - name: Run lint
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Check generated schemas
        run: >-
          uv run --frozen python -m tool_choice_contract_trial
          check-schemas --directory schemas/v1

      - name: Check generated v2 schemas
        run: >-
          uv run --frozen python -m tool_choice_contract_trial
          check-schemas-v2 --directory schemas/v2
