[project]
name = "tool-choice-contract-trial"
version = "0.1.0"
description = "Contract-aware evaluation harness for diagnosing invalid tool selection in AI systems."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.12,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
